  detail: >-
    Universal Hydrogen Co. ran out of cash and shut down on 27 June 2024, and both of its web
    hosts are gone: hydrogen.aero and www.hydrogen.aero answer a bare HTTP 404 "Unknown site"
    page on the root and on every /.well-known/ and specification path despite the A record
    still resolving, while universalhydrogen.com has been re-pointed to a Sedo parking lander
    whose wildcard catch-all returns the same parking HTML with a 200 on /llms.txt and
    /api-docs and CHEQ bot-filter 440/441 codes elsewhere. Its real GitHub organization is
    still live but holds zero public repositories, api./docs./developers.hydrogen.aero do not
    resolve, and the Wayback archive of the domain contains no developer or specification path
    — the company was a hydrogen fuel-capsule and powertrain hardware business that never
    published an API.
