aid: universal-hydrogen
name: Universal Hydrogen
description: >-
  Universal Hydrogen Co. was a Hawthorne, California hydrogen-aviation startup founded in 2020
  by former Airbus CTO Paul Eremenko to decarbonize regional air travel. Rather than building a
  hydrogen pipeline network, it proposed a modular capsule model: lightweight hydrogen capsules
  loaded into aircraft with existing cargo handling equipment, paired with fuel-cell powertrain
  conversion kits for regional turboprops such as the ATR 72 and De Havilland Dash 8. In March
  2023 it flew a converted Dash 8-300 testbed with one propeller driven by a hydrogen fuel cell.
  The company raised roughly $100 million from backers including GE Aviation, American Airlines,
  JetBlue Ventures, Airbus Ventures, Toyota Ventures and Mitsubishi. Unable to raise further
  equity or debt or to find a buyer, it ceased operations on 27 June 2024 and liquidated. It was
  a hardware and fuel-logistics business and never shipped a public API, SDK, developer portal
  or machine-readable specification; its domains no longer serve a site.
