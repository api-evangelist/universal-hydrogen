x-notes:
  website_pointer_removed: >-
    The stub's only pointer was type Website -> https://forgeglobal.com/universal-hydrogen_stock/,
    a Forge Global secondary-market listing page. That is a trading-venue page, not Universal
    Hydrogen's web presence, and wiring it as Website credits the company with a live site it does
    not have (roadmap#56). Removed 2026-09-02. The company's own hydrogen.aero returns 404 and
    universalhydrogen.com is a Sedo parking lander, so no Website pointer is emitted at all. The
    Forge URL itself could not be re-verified: it answered HTTP 403 with a Cloudflare "Just a
    moment..." interstitial to both a browser User-Agent probe and WebFetch, which is a bot
    challenge rather than proof the page is dead.
  name_collision: >-
    Do not conflate with Hydrogen Platform (hydrogenplatform.com), an unrelated fintech that does
    publish a developer API. Searches for "Hydrogen API" surface that company, not this one.
